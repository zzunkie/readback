<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Team sync slides</title>
<style>html,body{margin:0;height:100%;background:#000}img{width:100%;height:100%;object-fit:contain;display:block}</style></head>
<body><img id="slide" src="/sample/s1.jpg" alt="">
<script>
// The sample presentation on its own page, for presenting in a real call. Arrow keys move; window.__show(n) jumps.
const files = ['s1', 's2a', 's2', 's3', 's4', 's6', 's5', 's7', 's8']; let i = 1; const img = document.getElementById('slide');
window.__show = (k) => { i = Math.max(1, Math.min(files.length, k)); img.src = `/sample/${files[i - 1]}.jpg`; };
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') __show(i + 1); if (e.key === 'ArrowLeft') __show(i - 1); });
</script></body></html>
